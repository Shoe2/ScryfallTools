<h5 class="white-cursive-extra">Random Generators</h5>
<div class="row">
  <div class="col">
    <button (click)="randomCreatureType()" class="spin-trigger-btn">
      Creature Type
    </button>
  </div>
  <div class="col align-self-center">
    <span class="yellow-glow-text">{{ selectedCreatureType }}</span>
  </div>
</div>

<hr />
<div class="row">
  <div class="col">
    <button (click)="randomKeyword()" class="spin-trigger-btn">Keyword</button>
  </div>
  <div class="col align-self-center">
    <span class="yellow-glow-text">{{ selectedKeyword }}</span>
  </div>
</div>
<hr />

<div class="row">
  <div class="col">
    <button (click)="generateRandomColorIdentity()" class="spin-trigger-btn">
      Color Identity
    </button>
  </div>
  <div class="col align-self-center">
    <span
      *ngFor="let color of colorsForIdea"
      class="symbol color-{{ color }}"
      >{{ color }}</span
    >
  </div>
</div>
