<div class="column-container">
  <h4 class="white-cursive-extra">Random Deck Theme Generator</h4>
  <button class="spin-trigger-btn" (click)="generateDeckIdea()">
    Muse
  </button>
  <div *ngIf="ideas.length > 0">
    <div class="yellow-glow-text">
      Deck Idea: Make a <u>{{ ideas[0] }}</u> and <u>{{ ideas[1] }}</u> deck
    </div>
    <div class="yellow-glow-text">that is</div>
    <span *ngFor="let color of colorsForIdea" class="symbol color-{{ color }}">
      {{ color }}
    </span>
  </div>

</div>
