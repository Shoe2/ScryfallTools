<div class="column-container">
    <h1 class="white-cursive-extra text-center">Quest for the JankLord </h1>
 <h2  class="yellow-glow-text">Random Commander or commanders worth less than $0.79 USD)</h2>
<button (click)="newCommander()">
    <img class="wheel"
        src="https://cards.scryfall.io/art_crop/front/c/1/c14c07d4-6971-483a-add1-f3cdf18feae9.jpg"/>
</button>
<br />

<div class="shandalar-text" id="commanderDisplay" *ngIf="selectedCommander">
    {{selectedCommander?.name || ''}} 
</div>
<div *ngIf="selectedCommander && selectedCommander.image_uris">
<img style="width:300px" [src]="selectedCommander.image_uris.normal">

</div>
<!-- <div id="commanderDisplay" *ngIf="partner">
     and {{partner.name}}
</div> -->
</div>
